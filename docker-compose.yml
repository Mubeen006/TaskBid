version: "3.9"

services:
  mongo:
    image: mongo:7
    container_name: taskbid-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: |
        mongosh --quiet --eval '
          try {
            rs.status();
          } catch (e) {
            rs.initiate({
              _id: "rs0",
              members: [{ _id: 0, host: "localhost:27017" }]
            });
          }
        '
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

volumes:
  mongo-data:
